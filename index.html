<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Last Card</title>
    <meta name="description" content="A shrinking deck on a living board. One thumb. The last card saves the realm." />
    <!-- #216: the faces are self-hosted (src/ui/fonts.css + src/ui/fonts/,
         font-display: swap). A cross-origin stylesheet here was render-blocking:
         with no network, first paint and the module script behind it waited for
         the request to fail (white for 5-15 s, the #212 airplane-mode frames).
         Fonts must never gate first paint — this sheet is same-origin and its
         faces swap in over the system fallback stack below. -->
    <!-- #354: the two Lora faces the placards are set in (the summary line's
         italic and its bold figures). A face is only fetched when text first
         lays out in it, and the end-of-run placard is that first text — so the
         redraw that measured it (main.ts insets(), the placard's band) saw a
         placard 7 px shorter than its settled height, and the board's mask
         ended 7 px under it. Preloaded, the faces land during the module graph's
         own seconds and the placard is measured at its final size on the first
         paint; main.ts re-measures once on document.fonts.ready in case they
         did not. Fonts still never gate first paint (#216). -->
    <link rel="preload" as="font" type="font/woff2" crossorigin href="./assets/lora-latin-italic-DBI-iqMr.woff2">
    <link rel="preload" as="font" type="font/woff2" crossorigin href="./assets/lora-latin-BiLcIKcI.woff2">
    <style>
      :root {
        --bg: #f9e8cf;
        --ink: #3f3227;
        --chip: #ffffff;
      }
      * { margin: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
      html, body { height: 100%; width: 100%; overscroll-behavior: none; }
      body {
        margin: 0;
        background: transparent;
        color: var(--ink);
        font-family: 'Gantari', 'Avenir Next', system-ui, sans-serif;
        overflow: hidden;
        user-select: none;
        touch-action: manipulation;
        -webkit-font-smoothing: antialiased;
      }
      #app { position: relative; height: 100%; width: 100%; overflow: hidden; user-select: none; }
      #app.sky-noon { background: linear-gradient(178deg, #f9e8cf 0%, #f2dcbe 48%, #eccfab 100%); }
      #app.sky-dusk { background: linear-gradient(178deg, #e8b793 0%, #dd9d84 42%, #c97f79 100%); }
      /* #174: the industrial age's noon — same sky, smoke in it */
      #app.sky-era2 { background: linear-gradient(178deg, #ede0c4 0%, #dbc79f 48%, #c6af85 100%); }
      
      /* touch-action: none — the board's own drag IS the pan (CIT-8) */
      #board {
        position: absolute; inset: 0; width: 100%; height: 100%; display: block;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
      }
      #board text { font-family: 'Gantari', 'Avenir Next', system-ui, sans-serif; user-select: none; pointer-events: none; }

      /* #59: WebKit cannot composite an animated SVG child in isolation — any
         `animation: … infinite` inside #board invalidates and repaints the
         WHOLE board svg on every tick (measured: idle CPU 98–128% with only
         3–6 such nodes, vs. 0.2–0.4% with none; confirmed a single infinitely
         animated node alone still costs ~28% on this Mac, regardless of
         `will-change`). The card's own boundary allows this: "static art is
         acceptable, deleted art is not" — smoke, the legal ghost pulse and the
         tier-up glow keep their shapes and colors, they just stop being the
         thing that keeps the board's core busy at rest. */
      .smoke { opacity: 0.75; }

      .legal-pulse { opacity: 0.62; }

      /* #355 — ONE VOICE AT REST (compare #19: "the wharf HUD competes with a
         board that has no focal point"). The at-rest frame has one primary,
         the hand's playable card; every other piece of furniture sits a
         register down until it is the thing being decided, and comes back up
         on its own moment: the menu on press, the skill circle when a verb is
         armed, the deck when it can be bought from, the teaching lines when
         they answer an action, the quest badges when a quest is tapped. The
         register is a stylesheet fact keyed on a state main.ts already owns
         (`#skills.armed`, `#app.quest-focus`, `#cardhint.quiet`) — nothing
         is rebuilt per frame and no DOM is added. Measured by
         tests/hud_register.test.ts: mean |L - band| per element on x2 frames,
         loud at >= 40. */

      /* Menu button — at rest the three bars alone on the sky, the hex face
         only under the thumb. */
      #menu, .hexbtn {
        position: absolute; top: calc(20px + env(safe-area-inset-top)); left: calc(18px + env(safe-area-inset-left)); width: 48px; height: 48px; border: 0; padding: 0; cursor: pointer;
        background: transparent;
        z-index: 5;
      }
      #menu .hexface, .hexbtn .hexface {
        display: flex; width: 100%; height: 100%; align-items: center; justify-content: center;
        clip-path: polygon(50% 0, 96% 26%, 96% 74%, 50% 100%, 4% 74%, 4% 26%);
        background: rgba(255,252,244,0);
        transition: background-color 160ms ease-out;
      }
      #menu svg, .hexbtn svg { width: 19px; height: 14px; display: block; }
      #menu rect, .hexbtn rect { fill: rgba(74,61,49,.62); transition: fill 160ms ease-out; }
      #menu:active, .hexbtn:active { transform: scale(0.95); }
      #menu:active .hexface, #menu:focus-visible .hexface { background: rgba(255,252,244,.95); }
      #menu:active rect, #menu:focus-visible rect { fill: #4a3d31; }
      @media (hover: hover) {
        #menu:hover .hexface { background: rgba(255,252,244,.95); }
        #menu:hover rect { fill: #4a3d31; }
      }

      /* Build Stamp */
      #stamp, .stamp {
        position: absolute; top: calc(72px + env(safe-area-inset-top)); left: calc(20px + env(safe-area-inset-left));
        font-size: 9.5px; font-weight: 700; font-family: 'Gantari', monospace;
        color: rgba(97,62,32,.5); pointer-events: none;
        letter-spacing: 0.3px;
      }
      #app.sky-dusk #stamp { color: rgba(255,250,240,.6); }

      /* #164: the FPS meter — exists only while the toggle is on */
      #fps {
        position: absolute; top: calc(84px + env(safe-area-inset-top)); left: calc(20px + env(safe-area-inset-left));
        font-size: 9.5px; font-weight: 700; font-family: 'Gantari', monospace;
        color: rgba(97,62,32,.55); pointer-events: none;
        font-variant-numeric: tabular-nums;
      }
      #app.sky-dusk #fps { color: rgba(255,250,240,.6); }

      /* #164/#197: the settings debug area */
      .debug-area {
        margin-top: 6px;
        padding: 6px 8px;
        border-radius: 8px;
        background: rgba(97, 62, 32, 0.06);
        font-family: ui-monospace, monospace;
        font-size: 10px;
        color: rgba(97, 62, 32, 0.65);
        text-align: center;
      }

      /* HUD */
      #hud, .hud {
        position: absolute; top: calc(20px + env(safe-area-inset-top)); right: calc(18px + env(safe-area-inset-right));
        display: flex; flex-direction: column; align-items: flex-end;
        pointer-events: none;
        z-index: 5;
      }
      #score, .score {
        font-size: 38px; font-weight: 900; line-height: 1; letter-spacing: -.02em;
        color: #fffaf0;
        text-shadow: 0 2px 2px rgba(97,62,32,.35), 0 6px 18px rgba(97,62,32,.35);
        font-variant-numeric: tabular-nums;
      }
      /* #205 (reopened): the next-card track's home is the sheet — full width
         on the sheet card, label above the bar. */
      #reward { display: flex; flex-direction: column; align-items: stretch; gap: 5px; }
      #rewardbar, .rewardbar {
        width: 100%; height: 4px; border-radius: 2px;
        background: rgba(74,58,41,.25); overflow: hidden;
      }
      #rewardfill, .rewardbar i {
        display: block; height: 100%; width: 0%;
        background: #3f3227; border-radius: 2px;
      }
      #rewardfill.settled { transition: width 200ms ease-out; }
      #rewardlabel, .rewardlabel {
        font-size: 10px; font-weight: 800; letter-spacing: .03em;
        /* #216: pinned line-height — see .realm-flow-header. */
        line-height: 13px;
        color: #4a3d31;
      }
      #ledger, .ledgertag {
        display: flex; align-items: center; gap: 4px;
        margin-top: 4px; background: rgba(255,252,243,.92);
        border: 1.5px solid transparent; border-radius: 8px;
        padding: 2.5px 7px; box-shadow: 0 2px 6px rgba(97,62,32,.14);
        font-variant-numeric: tabular-nums;
      }
      #ledgericon, .coin {
        width: 13px; height: 13px; border-radius: 50%;
        background: radial-gradient(circle at 34% 30%, #f2d489, #d9a13f 58%, #a8752a);
        box-shadow: 0 1px 2px rgba(97,62,32,.4), inset 0 0 0 1.5px rgba(122,84,26,.55);
        flex: none; display: block;
      }
      #ledger { flex-wrap: wrap; max-width: 160px; }
      #ledgerbal, .ledgertag .bal { font-size: 15px; font-weight: 900; color: #3f3227; }
      #ledgernet, .ledgertag .net { font-size: 12px; font-weight: 900; color: #3f7a4e; }
      #ledgerwarn {
        display: none;
        flex-basis: 100%;
        font-size: 10px; font-weight: 700; font-style: italic;
        line-height: 1.25; color: #a8402c;
        padding-top: 2px;
      }
      #ledger.debt #ledgerwarn, #ledger.starved #ledgerwarn { display: block; }
      #ledger.falling #ledgernet { color: #b3543f; }
      #creditrunway {
        display: none; align-items: center; gap: 4px;
        min-width: 0; color: #a8402c;
      }
      #ledger.debt #creditrunway { display: flex; }
      #creditfraction {
        min-width: 31px; font-size: 10px; font-weight: 900; line-height: 13px;
        text-align: right; color: #a8402c; white-space: nowrap;
      }
      #credittrack {
        display: block; width: var(--credit-width, 7px); height: 7px;
        overflow: hidden; border: 1px solid rgba(168,64,44,.72); border-radius: 4px;
        background: repeating-linear-gradient(
          90deg,
          rgba(168,64,44,.09) 0,
          rgba(168,64,44,.09) calc(var(--credit-step, 7px) - 1px),
          rgba(168,64,44,.42) calc(var(--credit-step, 7px) - 1px),
          rgba(168,64,44,.42) var(--credit-step, 7px)
        );
        box-sizing: border-box;
      }
      #creditfill {
        display: block; height: 100%; width: 100%; transform-origin: left center;
        transform: scaleX(var(--credit-ratio, 1)); background: #d9a13f;
      }
      /* #61: `animation: alarmpulse … infinite` used to animate box-shadow
         itself — not a compositable property, so WebKit repainted the pill's
         shadow region every frame for as long as the player stayed in debt
         or locked (measured 32% all-WebKit CPU at rest on ?scenario=decay,
         vs 0.05% with a healthy ledger). A same-cost opacity pulse on a
         pseudo-element was tried and measured cheap but non-zero (~2%, and
         noisy up to ~3.4% on this rig) — the card's own boundary prefers
         "costs nothing" over "costs a little", and explicitly allows static
         alarm styling, so the glow is just static now. Red border, red
         numbers: still unmistakably in alarm, just not animated. */
      #ledger.pinned, #ledger.debt {
        background: rgba(255,246,238,.96);
        border-color: #b3543f;
        box-shadow: 0 2px 14px rgba(179,84,63,.55);
      }
      #ledger.pinned #ledgerbal, #ledger.pinned #ledgernet,
      #ledger.debt #ledgerbal, #ledger.debt #ledgernet {
        color: #a8402c;
      }
      @keyframes ledger-tick {
        0%   { transform: scale(1); }
        30%  { transform: scale(1.18); box-shadow: 0 4px 14px rgba(217,161,63,.55); }
        100% { transform: scale(1); }
      }
      #ledger.tick { animation: ledger-tick 520ms ease-out; }

      /* #257 — THE SKILL CIRCLE (the owner's ruling, 31 Aug 2026), replacing
         #231's left rail. The ruling: "on left side in a Quadrat [in C&C3]. We
         want the Same in a Circle left Side mid, no bar which Highlights them",
         and from the card, "Left Bar is blocking Sight."

         The BAR was the sight-blocker, not the buttons. So: the same verbs, the
         same contract, arranged on a CIRCLE at the board's left edge at mid
         height, as BARE round icons over the board — no rail, no panel, no
         reserved column. The container paints nothing and takes no pointer
         events; the board shows through around and between the icons and a tap
         in the gap reaches the map, which is the point of removing the rail.
         Geometry (the ring's radius, the slot angles) is main.ts's, beside the
         roster it lays out — this file styles one icon, not the arrangement. */
      #skills {
        position: absolute; left: 0; top: 0; bottom: 0; width: 100%;
        display: none; pointer-events: none; z-index: 5;
      }
      #skills.live { display: block; }
      /* One skill: a round face with its own frame, the way a C&C3 support
         power carries its own. That frame is the ICON's, not a bar behind the
         group — over grass or water the disc is what keeps the silhouette
         readable at x1 (roles/ui-developer.md's minimum step). */
      #skills .skill {
        position: absolute; appearance: none; padding: 0; cursor: pointer;
        width: 52px; height: 52px; border-radius: 50%;
        pointer-events: auto;
        background: rgba(255,252,243,.94);
        border: 2px solid rgba(90,72,52,.55);
        box-shadow: 0 2px 7px rgba(45,32,20,.35);
        /* #355: the circle's at-rest register. Geometry (#257) and the
           cooldown count (#314) are untouched; only the weight moves. */
        opacity: .7;
        transform: translate(var(--yield-x, 0px), var(--yield-y, 0px)) scale(.36);
        transform-origin: 50% 50%;
        transition: transform 180ms cubic-bezier(0.77, 0, 0.175, 1), opacity 160ms ease-out;
      }
      #app.hud-engaged #skills .skill {
        transform: translate(0, 0) scale(1);
      }
      #skills .skill:active { transform: scale(0.94); }
      /* The verb being decided — and, while any verb is armed, the whole
         circle, so the prices can be compared (`#skills.armed` is main.ts's). */
      #skills.armed .skill:not(.spent), #skills .skill:active, #skills .skill:focus-visible { opacity: 1; }
      @media (hover: hover) { #skills .skill:hover:not(.spent) { opacity: 1; } }
      /* The face is clipped into the disc; the price chip rides the rim OUTSIDE
         it, so the clip lives on a child rather than on the button. */
      #skills .skill .disc {
        position: absolute; inset: 0; border-radius: 50%; overflow: hidden;
        pointer-events: none;
      }
      #skills .skill .disc .face { display: block; width: 100%; height: 100%; }
      /* The price on the icon's face, C&C3's way: a coin chip on the rim.
         #355: at rest the chip is the disc's own cream with the ink stepped
         down — the number is still there to read, it just stops shouting;
         the dark chip (the full register) is what an armed circle wears. */
      #skills .skill .skill-price {
        position: absolute; right: -3px; bottom: -3px;
        min-width: 19px; height: 19px; padding: 0 3px; box-sizing: border-box;
        border-radius: 10px;
        background: rgba(255,252,243,.94); color: rgba(63,50,39,.82);
        border: 1px solid rgba(90,72,52,.4);
        display: flex; align-items: center; justify-content: center; gap: 2px;
        font-size: 11px; font-weight: 900; line-height: 1;
        font-variant-numeric: tabular-nums;
        box-shadow: 0 1px 2px rgba(30,20,12,.25);
        pointer-events: none;
        transition: background-color 160ms ease-out, color 160ms ease-out, border-color 160ms ease-out;
      }
      #skills.armed .skill .skill-price, #skills .skill:active .skill-price, #skills .skill:focus-visible .skill-price {
        background: #3f3227; color: #ffe9b8; border-color: #3f3227;
        box-shadow: 0 1px 3px rgba(30,20,12,.5);
      }
      @media (hover: hover) {
        #skills .skill:hover .skill-price {
          background: #3f3227; color: #ffe9b8; border-color: #3f3227;
          box-shadow: 0 1px 3px rgba(30,20,12,.5);
        }
      }
      #skills .skill .skill-price .coin { width: 9px; height: 9px; }
      /* The armed verb wears the selected card's outline, as the rail's did. */
      #skills .skill.armed { border-color: #2f2519; box-shadow: 0 0 0 3px rgba(255,236,190,.85), 0 2px 8px rgba(45,32,20,.45); }
      /* Spent / unaffordable: greys like the unplayable draft card, and still
         answers a tap with its reason (#231's contract, unchanged). */
      #skills .skill.spent { opacity: 0.45; filter: grayscale(35%); cursor: not-allowed; }
      #skills .skill.spent:active { transform: none; }
      /* #314 — remaining turns live IN the disc, quest-chip language (cream
         pill, Gantari 900, ink #3f3227). Core owns the number
         (`actionCooldownRemaining`); this only paints it. Opacity/filter on
         .spent would fade the count, so cooling restores the button and greys
         the FACE instead — unavailable before the tap, count still glanceable
         at x1 (22px in a 52px disc). */
      #skills .skill.cooling {
        opacity: .7;
        filter: none;
        cursor: not-allowed;
        border-color: rgba(90,72,52,.38);
      }
      #skills .skill.cooling .disc {
        opacity: 0.4;
        filter: grayscale(85%);
      }
      /* #303 — the verb coming OFF cooldown: the disc un-greys and the price
         chip returns, once, on the paint where main.ts sees cooling → ready
         (`.ready` is gated on that transition; a rebuild inside the window
         resumes via --ready-delay rather than replaying). Opacity and
         transform only; the grayscale simply drops with the .cooling class. */
      @keyframes skill-ready-disc {
        from { opacity: 0.4; }
        to   { opacity: 1; }
      }
      @keyframes skill-ready-chip {
        from { opacity: 0; transform: translateY(4px); }
        to   { opacity: 1; transform: translateY(0); }
      }
      #skills .skill.ready .disc {
        animation: skill-ready-disc 200ms cubic-bezier(0.23, 1, 0.32, 1) both;
        animation-delay: var(--ready-delay, 0ms);
      }
      #skills .skill.ready .skill-price {
        animation: skill-ready-chip 200ms cubic-bezier(0.23, 1, 0.32, 1) both;
        animation-delay: var(--ready-delay, 0ms);
      }
      #skills .skill .skill-count {
        position: absolute; left: 50%; top: 50%;
        transform: translate(-50%, -50%);
        min-width: 28px; height: 28px; padding: 0 5px;
        border-radius: 8px;
        background: rgba(255,253,246,0.96);
        color: #3f3227;
        border: 0.9px solid rgba(97,62,32,0.22);
        box-shadow: 0 1px 0 rgba(60,40,20,0.18);
        display: flex; align-items: center; justify-content: center;
        font-family: 'Gantari', sans-serif;
        font-size: 22px; font-weight: 900; line-height: 1;
        font-variant-numeric: tabular-nums;
        pointer-events: none;
      }
      /* #370 — ONE PLACARD PER SETTLEMENT, IN THE HUD'S OWN PAPER.
         The painter (painter3d.ts `settlementPlacard`) inlines the projection
         and nothing else; everything the eye reads is here, so the board's one
         piece of writing is set in the same register as the end-of-run placard
         below — the same cream (#fffcf3, carried at the register's own alpha),
         the hairline brown frame, ink #3f3227, Lora italic. It hangs off its
         anchor (`translate(-50%,-100%)`), so the point
         the painter projects is the card's bottom edge and the stem below it
         points back down at the landmark; the hex centre stays clear.
         WHICH placards stand at rest is here too: `data-rest` (the capital and
         the quest anchors) shows always, every other settlement waits for a
         held card, a pressed hex or a hovering mouse — `#app.placards-open`,
         main.ts's one owner of that moment. `visibility` rather than `display`
         so every card keeps its box and main.ts's collision pass can place them
         all at the settled frame, before any of them is asked for. */
      #board3d-labels .placard3d {
        position: absolute;
        transform: translate(-50%, -100%);
        display: flex; align-items: baseline; gap: 5px;
        padding: 2px 7px 3px;
        border-radius: 5px;
        background: rgba(255, 252, 243, 0.88);
        border: 0.9px solid rgba(97, 62, 32, 0.22);
        box-shadow: 0 2px 6px rgba(60, 40, 20, 0.2);
        white-space: nowrap;
        pointer-events: none;
        visibility: hidden;
        opacity: 0;
        transition: opacity 140ms ease-out;
      }
      /* the stem back down to the landmark the card names */
      #board3d-labels .placard3d::after {
        content: ''; position: absolute; left: calc(50% + var(--stem-dx, 0px)); top: 100%;
        margin-left: -3.5px;
        border-left: 3.5px solid transparent;
        border-right: 3.5px solid transparent;
        border-top: 5px solid rgba(255, 252, 243, 0.88);
      }
      /* #355's register, moved up to the card that now carries the quest pill:
         a free-standing pill was the unit before, the placard is the unit now,
         and a mark on the landscape stands a step down until the player asks
         for it — by tapping its quest (`#app.quest-focus`) or by any of the
         three asks in `#app.placards-open`. */
      #board3d-labels .placard3d[data-rest] { visibility: visible; opacity: .82; }
      #app.quest-focus #board3d-labels .placard3d[data-rest] { opacity: 1; }
      #app.placards-open #board3d-labels .placard3d { visibility: visible; opacity: 1; }
      #board3d-labels .placard3d .tile-label3d {
        font-family: 'Lora', Georgia, serif; font-style: italic;
        font-size: 11px; line-height: 13px; color: #3f3227;
      }
      #board3d-labels .placard3d .quest-badge3d {
        font-size: 11px; line-height: 13px; font-weight: 800;
        font-variant-numeric: tabular-nums; color: #3f3227;
        padding-left: 5px;
        border-left: 1px solid var(--quest-ink, rgba(97, 62, 32, 0.3));
      }
      @media (prefers-reduced-motion: reduce) {
        #board3d-labels .placard3d { transition: none; }
      }

      /* #216: an inline-block icon inside the text span rode the strut's
         baseline, which is font-metric dependent — the row changed height when
         the face swapped in. As a flex item it leaves the line box entirely. */
      .flow-kind-row .kind-name { display: inline-flex; align-items: center; }
      .flow-kind-row .res-icon { width: 14px; height: 14px; display: block; flex: none; margin-right: 4px; }
      .flow-kind-row .coin { margin-right: 4px; }

      /* The cream HUD variant died with #205's reopen: it existed only to keep
         the reward track legible over the dusk sky, and the track's home is
         the sheet now. */

      /* Deck Stack */
      #deck, .deckstack {
        position: absolute; right: calc(10px + env(safe-area-inset-right)); bottom: calc(16px + env(safe-area-inset-bottom)); width: 64px; height: 88px;
        pointer-events: none; z-index: 7;
        filter: drop-shadow(0 3px 5px rgba(97,62,32,.22));
        display: flex;
        /* #355: a count, not a decision — until it can be bought from. */
        opacity: .62;
        transition: opacity 160ms ease-out;
      }
      #deck.buyable {
        pointer-events: auto;
        cursor: pointer;
        opacity: 1;
      }
      #deck svg, .deckstack svg { width: 100%; height: 100%; overflow: visible; display: block; }
      @keyframes deck-tick {
        0%   { transform: scale(1); }
        30%  { transform: scale(1.2); }
        100% { transform: scale(1); }
      }
      #deck.tick { animation: deck-tick 480ms ease-out; }

      @keyframes card-earn {
        0%   { transform: translateY(0) scale(1); }
        30%  { transform: translateY(-10px) scale(1.08); }
        100% { transform: translateY(0) scale(1); }
      }
      .card.earned { animation: card-earn 520ms ease-out; }

      /* Tray and Hand */
      #tray, .tray {
        position: absolute; left: 0; right: 0; bottom: 0;
        padding: 10px calc(14px + env(safe-area-inset-right)) calc(20px + env(safe-area-inset-bottom)) calc(14px + env(safe-area-inset-left));
        display: flex; flex-direction: column; align-items: center; gap: 9px;
        background: rgba(250,240,222,.95);
        border-top: 1px solid rgba(97,62,32,.12);
        z-index: 6;
        transform: translateY(var(--tray-yield, 0px));
        transition: transform 180ms cubic-bezier(0.77, 0, 0.175, 1);
      }
      #app.hud-engaged #tray { transform: translateY(0); }
      #cardhint, #cardnote, .teach {
        font-size: 12px; line-height: 1.35; font-weight: 600; color: rgba(74,58,41,.75);
        text-align: center; max-width: 300px;
      }
      /* #355: the catalogue's teaching and the opening drag hint sit a
         register down; a line that ANSWERS something (a refused drop, a
         strike, a tapped quest, a locked draft, the coach) keeps the full
         register above. main.ts's redrawTeaching says which is which. */
      #cardhint.quiet, #cardnote.quiet {
        font-size: 11px; color: rgba(74,58,41,.58);
      }
      #cardhint:empty, #cardnote:empty { display: none; }
      #hand, .hand { display: flex; gap: 12px; touch-action: none; align-items: flex-end; }
      .card, .slab {
        width: 68px; height: 90px; border-radius: 13px; background: #fffdf6; position: relative;
        box-shadow: 0 1px 0 rgba(255,255,255,.9) inset, 0 5px 12px rgba(97,62,32,.22), 0 0 0 1px rgba(97,62,32,.10);
        display: flex; flex-direction: column; overflow: hidden; cursor: pointer;
        touch-action: none;
        transition: transform 120ms ease-out, box-shadow 120ms ease-out;
      }
      /* #355: in the hand, the selected card is the one primary; the others
         wait a step smaller (touch box stays 64x85, over the 44 floor). */
      #hand .card:not(.selected):not(.flying) { transform: scale(0.94); transform-origin: 50% 100%; }
      .card.selected, .slab.sel {
        transform: translateY(-10px) rotate(-2.5deg);
        box-shadow: 0 1px 0 rgba(255,255,255,.9) inset, 0 14px 26px rgba(97,62,32,.32), 0 0 0 2px #4a3d31;
      }
      .card.unplayable, .slab.unplayable {
        opacity: 0.45; filter: grayscale(30%); cursor: not-allowed;
      }
      .flying-tile.illegal {
        opacity: 0.48;
        filter: grayscale(0.7) drop-shadow(0 8px 10px rgba(116, 28, 22, 0.42)) !important;
      }
      .card.lifted, .slab.lifted {
        border: 1.5px dashed rgba(74,58,41,0.35); background: rgba(255,253,246,0.35); box-sizing: border-box;
        box-shadow: none;
      }
      .card.lifted *, .slab.lifted * { display: none; }
      .card.flying {
        position: fixed; left: 0; top: 0; z-index: 10;
        pointer-events: none;
        box-shadow: 0 14px 28px rgba(50, 35, 20, 0.35);
        transform: rotate(-3deg) scale(1.05);
      }
      .card .face, .card .art, .slab .art { flex: 1; display: block; width: 100%; height: auto; }
      .card .label, .card .name, .slab .name {
        font-size: 9.3px; font-weight: 800; letter-spacing: .03em; text-transform: uppercase; color: #4a3d31;
        /* #216: pinned line-height — `normal` is font-metric dependent, so the
           label moved 1 css px when the face swapped in over the fallback. */
        line-height: 11px;
        text-align: center; padding: 3px 1px 6px; background: #fffdf6; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      }
      .card.locked, .slab.locked {
        background: #f4ebd8;
        box-shadow: 0 1px 0 rgba(255,255,255,.9) inset, 0 2px 6px rgba(97,62,32,.18), 0 0 0 1.5px rgba(63,50,39,.5);
      }
      .card.locked .label, .card.locked .name, .slab.locked .name {
        background: #f4ebd8;
        color: #4a3d31;
        padding: 3px 1px 6px;
      }
      .locked-banner, .card-locked-header {
        position: static;
        background: #3f3227; color: #f8ecd8;
        font-size: 8px; font-weight: 800; letter-spacing: .18em;
        padding: 3px 0 2px; text-align: center; text-transform: uppercase;
      }

      /* #303 proposal 3 — decay/war lock into the draft. card-earn's mirror:
         heavier, settling downward rather than bouncing up — no overshoot,
         ease-in instead of ease-out, the "bad news lands and stays" read. */
      @keyframes card-locked-in {
        0%   { opacity: 0; transform: translateY(-8px); }
        100% { opacity: 1; transform: translateY(0); }
      }
      .card.locked-in { animation: card-locked-in 420ms ease-in; }

      /* #71: Idle Producers & Want Marks */
      #board g.tile.idle {
        opacity: 0.58;
      }
      .want-mark, .construction-stakes {
        pointer-events: none;
      }

      /* Board Gains & Animations */
      @keyframes gain-rise {
        0%   { opacity: 0; transform: translateY(6px) scale(0.9); }
        18%  { opacity: 1; transform: translateY(0) scale(1); }
        100% { opacity: 0; transform: translateY(-22px) scale(1); }
      }
      #board .gain { animation: gain-rise 900ms ease-out forwards; }

      /* #369: the same landing as the 3D painter's, in the form CSS can carry —
         an 8-unit drop on the shared ease-out over 300 of the 380 ms, then the
         1.03 overshoot leaving over the last 80. render.ts's LAND_MS,
         LAND_DROP_MS, LAND_RISE and LAND_OVERSHOOT are the owners of these
         numbers and painter.test.ts holds this rule to them. */
      @keyframes tile-land {
        0%     { transform: translateY(-8px) scale(1); opacity: 0.35;
                 animation-timing-function: cubic-bezier(0.23, 1, 0.32, 1); }
        78.94% { transform: translateY(0) scale(1); opacity: 1;
                 animation-timing-function: linear; }
        78.95% { transform: translateY(0) scale(1.03); opacity: 1;
                 animation-timing-function: cubic-bezier(0.23, 1, 0.32, 1); }
        100%   { transform: translateY(0) scale(1); opacity: 1; }
      }
      #board g.tile.land {
        transform-box: fill-box; transform-origin: center;
        animation: tile-land 380ms linear both;
      }

      @keyframes term-show {
        0%   { opacity: 0; }
        16%  { opacity: 1; }
        70%  { opacity: 1; }
        100% { opacity: 0; }
      }
      #board .term { animation: term-show 900ms ease-out forwards; }

      /* Run Menu Sheet */

        background: rgba(59, 42, 28, 0.38);

      #sheetcard button:active, .sheet button:active { transform: scale(0.985); }

      /* #71: Realm Flow Readout */
      .realm-flow {
        background: #f4ebd8;
        border-radius: 14px;

        display: flex;
        flex-direction: column;

      .realm-flow-header {

        line-height: 13px;

        letter-spacing: .12em;
        text-transform: uppercase;

        line-height: 15px;

        font-variant-numeric: tabular-nums;

      /* Museum Gallery Sheet (#40) */
      #museumsheet.open { display: flex; }

        padding: 16px 14px 14px;
      }

      /* #175: era-correct frames — a kept realm wears its age. Era 1 keeps the

      /* Moments Motion (#94) */
      /* TierUp Moment Animations */
